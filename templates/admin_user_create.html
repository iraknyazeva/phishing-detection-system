<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/><title>Создать пользователя</title></head>
<body>
  <p><a href="/admin/users">← Назад</a></p>
  <h1>Создать пользователя</h1>

  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}

  <form method="post" action="/admin/users/create">
    <div><label>Логин</label> <input name="username" required></div>
    <div><label>Email</label> <input name="email" type="email" required></div>
    <div><label>Пароль</label> <input name="password" type="password" required></div>
    <div>
      <label>Роль</label>
      <select name="role">
        {% for r in roles %}<option value="{{r}}">{{ r }}</option>{% endfor %}
      </select>
    </div>
    <button type="submit">Создать</button>
  </form>
</body>
</html>
