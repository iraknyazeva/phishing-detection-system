<!-- app/templates/index.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Проверка URL — Система предостережения фишинга</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Проверка URL на признаки фишинга</h1>

    <form id="urlForm" class="mb-4">
      <div class="mb-3">
        <label for="urlInput" class="form-label">Введите URL</label>
        <input type="url" class="form-control" id="urlInput" placeholder="https://example.com/login" required>
      </div>
      <button type="submit" class="btn btn-primary">Проверить</button>
    </form>

    <div id="resultArea" class="mt-4"></div>
  </div>

  <script>
    const form = document.getElementById('urlForm');
    const resultArea = document.getElementById('resultArea');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultArea.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Загрузка...</span></div> Анализ...';
      const url = document.getElementById('urlInput').value;
      try {
        const resp = await fetch('/analyze/url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        if (!resp.ok) {
          const err = await resp.json();
          resultArea.innerHTML = `<div class="alert alert-danger">Ошибка: ${err.detail || resp.statusText}</div>`;
          return;
        }
        const data = await resp.json();
    
        const score = Math.round((data.suspicion_score || 0) * 100);
        const verdictClass = data.is_phishing_suspected ? 'danger' : 'success';
        resultArea.innerHTML = `
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Результат анализа: <span class="badge bg-${verdictClass}">${data.is_phishing_suspected ? 'Подозрительно' : 'Нормально'}</span></h5>
              <p><strong>URL:</strong> <a href="${data.url}" target="_blank" rel="noopener noreferrer">${data.url}</a></p>
              <p><strong>Хост:</strong> ${data.hostname}</p>
              <p><strong>Оценка подозрительности:</strong> ${score}%</p>
              <pre style="white-space:pre-wrap; background:#f8f9fa; padding:10px; border-radius:6px;">${JSON.stringify(data.details, null, 2)}</pre>
            </div>
          </div>
        `;
      } catch (err) {
        resultArea.innerHTML = `<div class="alert alert-danger">Ошибка сети: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
