<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/><title>Пользователи</title></head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><a href="/dashboard">← ЛК</a> | <b>Пользователи</b></div>
    <div><a href="/logout">Выйти</a></div>
  </div>

  <hr/>

  <p><a href="/admin/users/create">+ Создать пользователя</a></p>

  <table border="1" cellpadding="6" cellspacing="0">
    <thead>
      <tr><th>ID</th><th>Логин</th><th>Email</th><th>Роль</th><th>Активен</th><th>Действия</th></tr>
    </thead>
    <tbody>
    {% for u in users %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>
          <form method="post" action="/admin/users/{{u.id}}/role" style="display:flex;gap:6px">
            <select name="role">
              {% for r in roles %}
                <option value="{{r}}" {% if u.role==r or (u.role=="analyst" and r=="monitoring") %}selected{% endif %}>{{ r }}</option>
              {% endfor %}
            </select>
            <button type="submit">Сменить</button>
          </form>
        </td>
        <td>{{ "да" if u.is_active else "нет" }}</td>
        <td>
          <form method="post" action="/admin/users/{{u.id}}/toggle">
            <button type="submit">{{ "Отключить" if u.is_active else "Включить" }}</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</body>
</html>
